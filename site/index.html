<!DOCTYPE html>
<html lang="ka">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>საწვავის ფასები საქართველოში</title>
        <meta name="description"
              content="სად ჩაასხა ახლოს და იაფად: საწვავის ფასები და სადგურები საქართველოში, კომპანიების ოფიციალური საიტებიდან.">
        <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header class="top">
            <h1 id="title">⛽ საწვავის ფასები</h1>
        </header>
        <main>
            <fieldset class="fuels" id="fuels">
                <legend class="visually-hidden" id="fuels-legend">საწვავის ტიპი</legend>
            </fieldset>
            <div id="map" class="map"></div>
            <p id="status" class="status" aria-live="polite">იტვირთება…</p>
            <section class="prices" aria-labelledby="prices-title">
                <h2 id="prices-title" data-i18n="table.title">ფასები კომპანიების მიხედვით</h2>
                <table id="price-table">
                    <thead>
                        <tr>
                            <th scope="col" data-i18n="table.company">კომპანია</th>
                            <th scope="col" data-i18n="table.price">ფასი</th>
                            <th scope="col" data-i18n="table.time">განახლდა</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </section>
        </main>
        <footer class="foot">
            <p id="source-note">ფასები მოდის კომპანიების ოფიციალური საიტებიდან და სადგურზე შეიძლება განსხვავდებოდეს.</p>
        </footer>
        <script src="vendor/leaflet/leaflet.js"></script>
        <script type="module" src="js/app.js"></script>
    </body>
</html>
