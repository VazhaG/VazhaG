:\"To be defiled later.\",\"additionalImages\":[{\"size\":1078766,\"originalFileName\":\"LMP_6392-Edit.jpg\",\"imageName\":\"88e90303-702a-44f7-b943-e93db2b9631a_LMP_6392-Edit.jpg\",\"contentType\":\"image/jpeg\",\"url\":\"https://fs01-tb.sgp.ge/api/v1/buckets/socar-s3/objects/download?preview=true\u0026prefix=88e90303-702a-44f7-b943-e93db2b9631a_LMP_6392-Edit.jpg\"},{\"size\":1078821,\"originalFileName\":\"LMP_6420-Edit.jpg\",\"imageName\":\"9b669eaf-90e6-403a-b414-ff2e05dbd2ba_LMP_6420-Edit.jpg\",\"contentType\":\"image/jpeg\",\"url\":\"https://fs01-tb.sgp.ge/api/v1/buckets/socar-s3/objects/download?preview=true\u0026prefix=9b669eaf-90e6-403a-b414-ff2e05dbd2ba_LMP_6420-Edit.jpg\"},{\"size\":974318,\"originalFileName\":\"LMP_7240 (1).jpg\",\"imageName\":\"2415a7fb-6232-4bb1-aaef-550010d4f96f_LMP_7240 (1).jpg\",\"contentType\":\"image/jpeg\",\"url\":\"https://fs01-tb.sgp.ge/api/v1/buckets/socar-s3/objects/download?preview=true\u0026prefix=2415a7fb-6232-4bb1-aaef-550010d4f96f_LMP_7240 (1).jpg\"}]},{\"categoryIdList\":[1],\"newsId\":46161,\"newsDetailId\":11134,\"title\":\"სპეციალური ოლიმპიადის გუნდის წარმატება ჟენევაში\",\"content\":\"\u003cp\u003eსოკარის მხარდაჭერით, საქართველოს სპეციალური ოლიმპიადის გუნდმა შვეიცარიაში, ქალაქ ჟენევაში გამართულ თაგ-რაგბის საერთაშორისო ტურნირზე იასპარეზა და ვერცხლის მედლები მოიპოვა.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eგუნდმა ტურნირზე 9 შეხვედრა გამართა, საიდანაც 7 მოიგო, ერთი ფრედ დაასრულა და მხოლოდ ფინალურ მატჩში, საფრანგეთთან დაძაბულ შეხვედრაში, მინიმალური სხვაობით დამარცხდა.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eსაქართველოს სპეციალური ოლიმპიადის \u0026nbsp;გუნდი, რომელიც 2024 წელს შეიქმნა, საერთაშორისო ტურნირებზე წარმატებულ ასპარეზობას აგრძელებს. სამი წლის განმავლობაში მის ანგარიშზე ჯამში 24 გამარჯვება, 4 ფრე და მხოლოდ ერთი მარცხია.\u003c/p\u003e\u003cp\u003e\u003cbr\u003e\u003c/p\u003e\u003cp\u003eშშმ პირთა უფლებების რეალიზაციის მხარდაჭერა და მათთვის თანაბარი შესაძლებლობე r: rgb(0, 102, 204);\\\"\u003e\u003cu\u003eიხილეთ გათამაშების წესები და პირობები\u003c/u\u003e\u003c/a\u003e\u003c/p\u003e\",\"imageName\":\"948c88ee-50fc-4f98-b532-d1ddacd79436_geo web (1).jpg\",\"imageSize\":454700,\"imageUrl\":\"https://fs01-tb.sgp.ge/api/v1/buckets/socar-s3/objects/download?preview=true\u0026prefix=948c88ee-50fc-4f98-b532-d1ddacd79436_geo web (1).jpg\",\"useStartDateTime\":\"01-09-2026 10:20:01\",\"useEndDateTime\":\"01-01-2099 00:00:00\",\"languageId\":1,\"slug\":\"gatamasheba-dasrulda-daelodet-lives\",\"webUrl\":\"To be defiled later.\"},{\"categoryIdList\":[1],\"newsId\":46157,\"newsDetailId\":11124,\"title\":\"ბახმაროს თასი 2026\",\"content\":\"\u003cp\u003eსოკარის მხარდაჭერით, 19 აგვისტოს კურორტ ბახმაროში ტრადიციული დოღი „ბახმაროს თასი 2026“ გაიმართა. ღონისძიებამ საქართველოს სხვადასხვა რეგიონიდან მხედრები გააერთიანა და ბახმაროს საზაფხულო სეზონის ერთ-ერთ გამორჩეულ სანახაობად იქცა.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eბახმაროში დოღის ტრადიცია გასული საუკუნის 30-იანი წლებიდან იღებს სათავეს და ყოველწლიურად, ფერისცვალების დღესასწაულზე, კურორტის ისტორიულ და კულტურულ მნიშვნელობას კიდევ ერთხელ წარმოაჩენს. „ბახმაროს თასი 2026“-ის ფარგლებში რამდენიმე გარბენი გაიმართა, მათ შორის „ნაბეღლავის თასი“, „გურიის თასი“, „გმირების თასი“ და მთავარი გარბენი - „ბახმაროს თასი“ მარულა, 4 800-მეტრიან დისტანციაზე.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eღონისძიებამ გააერთიანა სპორტული სანახაობა, ეროვნული ტრადიცია, ადგილობრივი კულტურა და ბახმაროს უნიკალური გარემო. სოკარისთვის მსგავსი ინიციატივების მხარდაჭერა ქართული ტრადიციების, რეგიონული ღონისძიებებისა და ეროვნული მემკვიდრეობის პოპულარიზაციის ხელშეწყობას უკავშირდება.\u003c/p\u003e\",\"imageName\":\"16848b50-c4a9-4af8-a112-ca72b88d5aec_406A6578 (1).jpg\",\"imageSize\":1188426,\"imageUrl\":\"https://fs01-tb.sgp.ge/api/v1/buckets/socar-s3/objects/download?preview=true\u0026prefix=16848b50-c4a9-4af8-a112-ca72b88d5aec_406A6578 (1).jpg\",\"useStartDateTime\":\"20-08-2026 1 5f7b665-88cd-4e0e-a10c-08978a12bb97_DSC08013 (1).jpg\",\"contentType\":\"image/jpeg\",\"url\":\"https://fs01-tb.sgp.ge/api/v1/buckets/socar-s3/objects/download?preview=true\u0026prefix=45f7b665-88cd-4e0e-a10c-08978a12bb97_DSC08013 (1).jpg\"},{\"size\":935956,\"originalFileName\":\"_DSC1879 (1).jpg\",\"imageName\":\"fd484b95-9255-46c6-ac11-cc313c318a06__DSC1879 (1).jpg\",\"contentType\":\"image/jpeg\",\"url\":\"https://fs01-tb.sgp.ge/api/v1/buckets/socar-s3/objects/download?preview=true\u0026prefix=fd484b95-9255-46c6-ac11-cc313c318a06__DSC1879 (1).jpg\"}]},{\"categoryIdList\":[1],\"newsId\":46151,\"newsDetailId\":11100,\"title\":\"სოკარის მხარდაჭერით გუდაურის დასუფთავების დღეები გაიმართა\",\"content\":\"\u003cp\u003e27-28 ივნისს, სოკარის მხარდაჭერითა და \u0026nbsp;ორგანიზაცია „სადაგის“ ინიციატივით გუდაურის დასუფთავების დღეები გაიმართა. გარემოსდაცვით ინიციატივაში 150-ზე მეტი მოხალისე ჩაერთო, რომლებმაც ერთობლივი ძალებით გუდაურის ტერიტორია დაასუფთავეს.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eკამპანიის ფარგლებში მონაწილეებმა წინასწარ შერჩეულ ლოკაციებზე ნარჩენები შეაგროვეს და ტერიტორიის მოწესრიგებაში მიიღეს მონაწილეობა. მსგავსი აქტივობები ხელს უწყობს როგორც გარემოზე ზრუნვის კულტურის გაძლიერებას, ასევე საზოგადოებრივი ჩართულობის წახალისებას.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eეკომეგობრული პროექტების მხარდაჭერა სოკარის კორპორაციული სოციალური პასუხისმგებლობის ერთ-ერთი მნიშვნელოვანი მიმართულებაა. კომპანია აგრძელებს ისეთი ინიციატივების ხელშეწყობას, რომლებიც გარემოს დაცვასა და მდგრადი განვითარების იდეის პოპულარიზაციას ემსახურება.\u003c/p\u003e\",\"imageName\":\"6c5a3720-ee0b-45ef-95d6-16fe6594f1f7_FRS00145.JPG\",\"imageSize\":2240542,\"imageUrl\":\"https://fs01-tb.sgp.ge/api/v1/buckets/socar-s3/objects/download?preview=true\u0026prefix=6c5a3720-ee0b-45ef-95d6-16fe6594f1f7_FRS00145.JPG\",\"useStartDateTime\":\"16-07-2026 13:52:38\",\"useEndDateTime\":\"01-01-2099 00:00:00\",\"languageId\":1,\"slug\":\"sadagis-iniciativit-gudauris-dasuftaveba\",\"webUrl\":\"To be defiled later.\",\"additionalImages\":[{\"size\":3048013,\"originalFileName\":\"FRS00243.JPG\",\"imageName\":\"d1c26a7a-6650-40e9-8ed6-022d17dbf659_FRS00243.JPG\",\"contentType\":\"image/jpeg\",\"url\":\"https://fs01-tb.sgp.ge/api/v1/buckets/socar-s3/objects/download?preview=true\u0026prefix=d1c26a7a-6650-40e9-8ed6-022d17dbf659_FRS00243.JPG\"},{\"size\":1758651,\"originalFileName\":\"FRS09899.JPG\",\"imageName\":\"9256eb19-e9f8-48aa-9d5d-258b4acfa546_FRS09899.JPG\",\"contentType\":\"image/jpeg\",\"url\":\"https://fs01-tb.sgp.ge/api/v1/buckets/socar-s3/objects/download?preview=true\u0026prefix=9256eb19-e9f8-48aa-9d5d-258b4acfa546_FRS09899.JPG\"},{\"size\":2184361,\"originalFileName\":\"FRS00192.JPG\",\"imageName\":\"26793a10-31a9-460c-85de-8620ab9675f3_FRS00192.JPG\",\"contentType\":\"image/jpeg\",\"url\":\"https://fs01-tb.sgp.ge/api/v1/buckets/socar-s3/objects/download?preview=true\u0026prefix=26793a10-31a9-460c-85de-8620ab9675f3_FRS00192.JPG\"},{\"size\":4001885,\"originalFileName\":\"FRS00167.JPG\",\"imageName\":\"27104a4b-8115-4cbc-b617-e96999fe4f38_FRS00167.JPG\",\"contentType\":\"image/jpeg\",\"url\":\"https://fs01-tb.sgp.ge/api/v1/buckets/socar-s3/objects/download?preview=true\u0026prefix=27104a4b-8115-4cbc-b617-e96999fe4f38_FRS00167.JPG\"}]},{\"categoryIdList\":[1],\"newsId\":46149,\"newsDetailId\":11096,\"title\":\"„გაცვლა“ - მდგრადი ტრანსფორმაციის გამოფენა სოკარის მხარდაჭერით\",\"content\":\"\u003cp\u003e26 ივნისს, თბილისში, კომბინატის სივრცეში, სოციალური საწარმო „სადგურის“ ინიციატივით, რიგით მეორე მდგრადი ტრანსფორმაციის გამოფენა „გაცვლა“ გაიმართა. პროექტში სოკარმა უკვე მეორედ მიიღო მონაწილეობა და კიდევ ერთხელ დაუჭირა მხარი ინიციატივას, რომელიც ხელოვნებას, მდგრად განვითარებასა და გარემოზე ზრუნვის იდეას აერთიანებს.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003eგამოფენის ფარგლებში წარმოდგენილი იყო კერძო კომპანიების გამოუსადეგარი და მეორადი მასალებისგან შექმნილი ექსპონატები, რომლებმაც ძველ ნივთებს ახალი ფორმა, ფუნქცია და შინაარსი შესძინა. მათ შორის იყო სოკარის მასალებისგან შექმნილი ნამუშევრებიც, რომლებიც კომპანიის მდგრადი განვითარების ხედვას შემოქმედებითი ფორმით გადმოსცემდა.\u003c/p\u003e\u003cp\u003e\u0026nbsp;\u003c/p\u003e\u003cp\u003e„გაცვლა“ წარმოადგენს პლატფორმას, რომელიც ბიზნესს, ხელოვნებასა და საზოგადოებას მდგრადი ტრანსფორმაციის საერთო იდეის გარშემო აერთიანებს. პროექტში მონაწილეობით სოკარი კიდევ ერთხელ უსვამს ხაზს, რომ მდგრადი განვითარება და გარემოზე ზრუნვა კომპანიის სოციალური პასუხისმგებლობის ერთ-ერთი პრიორიტეტული მიმართულებაა.\u003c/p\u003e\u003cp\u003e \u003c/p\u003e\u003cp\u003e \u003c/p\u003e\",\"imageName\":\"b429fd84-6f64-4295-8173-a6009dd0e232_DSC04003 (1).jpg\",\"imageSize\":751216,\"imageUrl\":\"https://fs01-tb.sgp.ge/api/v1/buckets/socar-s3/objects/download?preview=true\u0026prefix=b429fd84-6f64-4295-8173-a6009dd0e232_DSC04003 (1).jpg\",\"useStartDateTime\":\"16-07-2026 11:15:35\",\"useEndDateTime\":\"01-01-2099 00:00:00\",\"languageId\":1,\"slug\":\"gatsvla-mdgradi-transformaciis-gamopena\",\"webUrl\":\"To be defiled later.\",\"additionalImages\":[{\"size\":1010264,\"originalFileName\":\"DSC03902 (1).jpg\",\"imageName\":\"58bf231a-4eb4-4c82-8f5b-dbeaa12f4c58_DSC03902 (1).jpg\",\"contentType\":\"image/jpeg\",\"url\":\"https://fs01-tb.sgp.ge/api/v1/buckets/socar-s3/objects/download?preview=true\u0026prefix=58bf231a-4eb4-4c82-8f5b-dbeaa12f4c58_DSC03902 (1).jpg\"},{\"size\":461885,\"originalFileName\":\"DSC04078.jpg\",\"imageName\":\"8390ca51-14f5-4d09-a6b1-d7d8c93a9c6f_DSC04078.jpg\",\"contentType\":\"image/jpeg\",\"url\":\"https://fs01-tb.sgp.ge/api/v1/buckets/socar-s3/objects/download?preview=true\u0026prefix=8390ca51-14f5-4d09-a6b1-d7d8c93a9c6f_DSC04078.jpg\"},{\"size\":947526,\"originalFileName\":\"DSC03860 (1).jpg\",\"imageName\":\"0e6ceef2-fd45-42fc-93f7-c9da040a35b5_DSC03860 (1).jpg\",\"contentType\":\"image/jpeg\",\"url\":\"https://fs01-tb.sgp.ge/api/v1/buckets/socar-s3/objects/download?preview=true\u0026prefix=0e6ceef2-fd45-42fc-93f7-c9da040a
